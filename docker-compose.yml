services:
  mysql:
    image: mysql:8.0
    container_name: sclink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sclink_dev_root
      MYSQL_DATABASE: sc_link
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psclink_dev_root"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
